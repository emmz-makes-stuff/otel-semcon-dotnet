# Weaver target for the .NET semantic conventions packages.
#
# Run once per project by scripts/generate.sh, which passes:
#   stable_only      true for the stable package, false for the Incubating package
#   root_namespace   <SemanticConventionsRootNamespace> from Package.props
#   semconv_version  <SemanticConventionsVersion> from Directory.Build.props

params:
  # Root namespaces that are specific to other language runtimes or platforms.
  excluded_namespaces: [android, cpython, go, ios, jvm, nodejs, v8js]

templates:
  - pattern: attributes.cs.j2
    filter: >
      semconv_grouped_attributes({
        "exclude_root_namespace": $excluded_namespaces,
        "stable_only": $stable_only
      })
      | map({
          root_namespace: .root_namespace,
          attributes: .attributes,
          stable_only: $stable_only,
          csharp_namespace: (if $stable_only then $root_namespace else $root_namespace + ".Incubating" end)
        })
    application_mode: each

  - pattern: metrics.cs.j2
    filter: >
      semconv_grouped_metrics({
        "exclude_root_namespace": $excluded_namespaces,
        "stable_only": $stable_only
      })
      | map({
          root_namespace: .root_namespace,
          metrics: [.metrics[] | select(.annotations.code_generation.exclude | not)],
          stable_only: $stable_only,
          csharp_namespace: (if $stable_only then $root_namespace else $root_namespace + ".Incubating" end)
        })
      | map(select(.metrics | length > 0))
    application_mode: each

comment_formats:
  xmldoc:
    format: html
    prefix: "/// "
    old_style_paragraph: false
    omit_closing_li: false
    inline_code_snippet: "<c>{{code}}</c>"
    block_code_snippet: "<code>{{code}}</code>"
    trim: true
    remove_trailing_dots: false

default_comment_format: xmldoc

whitespace_control:
  trim_blocks: true
  lstrip_blocks: true
